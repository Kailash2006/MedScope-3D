# MedScope 3D — PRODUCTION stack (single cloud/server host).
#
# Differences from docker-compose.yml (dev):
#   - db + redis have NO published host ports (internal Docker network only).
#   - web + api are bound to 127.0.0.1 — put a TLS-terminating reverse proxy
#     (nginx / Caddy / Traefik) in front to serve your public https/wss origin.
#   - the web image is built with the REAL public API/WS URLs baked in.
#   - a one-shot `migrate` service runs Alembic before the API starts.
#   - restart: unless-stopped on long-running services.
#
# Deploy on the server:
#   1) cp .env.example .env   then set REAL secrets + PUBLIC_* URLs (see below).
#   2) place the trained model .joblib in ml/artifacts/ on THIS host
#      (it is gitignored, so a fresh clone will not have it — copy it over).
#   3) docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Required .env values for production:
#   POSTGRES_PASSWORD   strong, unique
#   SESSION_SECRET      real >=32-char random value (IP-hash salt)
#   ADMIN_TOKEN         strong value (empty => /admin is disabled for everyone)
#   CORS_ORIGINS        your public web origin, e.g. https://app.example.com
#   PUBLIC_API_URL      public API origin the browser calls, e.g. https://api.example.com
#   PUBLIC_WS_URL       public WS origin, e.g. wss://api.example.com
#
# NOTE: PUBLIC_API_URL / PUBLIC_WS_URL are compiled into the web bundle at BUILD
# time. If you change them, rebuild the web image (add --build).
name: medscope-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medscope}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medscope}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration. Runs `alembic upgrade head` and exits; the API
  # waits for it to complete successfully before starting.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medscope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medscope}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medscope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medscope}
      REDIS_URL: redis://redis:6379/0
      ML_ARTIFACT_DIR: /app/ml/artifacts
    volumes:
      # The trained model, read-only. Override the host path with ML_ARTIFACT_HOST_DIR.
      # If the dir has no model_*.joblib, the API runs rules-only (safe fallback).
      - ${ML_ARTIFACT_HOST_DIR:-../ml/artifacts}:/app/ml/artifacts:ro
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; reverse proxy forwards to it
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Baked into the client bundle at build time (Next.js NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env (e.g. https://api.example.com)}
        NEXT_PUBLIC_WS_BASE_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL in .env (e.g. wss://api.example.com)}
    ports:
      - "127.0.0.1:3000:3000"   # loopback only; reverse proxy forwards to it
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db_data:
