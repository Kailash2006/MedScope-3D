[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medscope-api"
version = "0.0.0"
description = "MedScope 3D triage API (FastAPI). Rules -> ML -> fallback triage engine, WS gateway, audit, retention."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "websockets>=12.0",
    "fpdf2>=2.7",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    # triage-shared and medscope-ml are installed separately (editable in dev,
    # pip-installed in Docker). The PredictionService imports medscope_ml lazily.
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
