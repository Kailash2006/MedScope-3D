name: CI

on:
  push:
  pull_request:

jobs:
  js:
    name: JS/TS lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Typecheck (shared + web)
        run: |
          npm run build --workspace packages/triage-shared
          npm run typecheck --workspace apps/web
      - name: Test (parity + web contract)
        run: npm run test

  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared + api + ml
        run: |
          pip install -e ./packages/triage-shared/python
          pip install -e "./services/api[dev]"
          pip install -e "./ml[dev]"
          pip install pytest
      - name: Shared parity tests
        run: pytest packages/triage-shared/python/tests -q
      - name: API tests
        run: pytest services/api/tests -q
      - name: ML tests (dataset, eval gate, golden vector, generator parity)
        run: pytest ml/tests -q
      - name: Ruff lint (api + ml)
        run: ruff check services/api ml
